version: 2

sources:
  - name: ecom
    schema: raw
    description: >-
      Raw e-commerce data containing customers, products, orders, and order line
      items, used as input for staging models that standardize and validate the data.
    tables:
      - name: customers
        identifier: raw_customers
        description: >-
          Customer records with one row per customer, including name, email,
          registration date, city, and state, before staging transformations.
        columns:
          - name: customer_id
            data_tests: [not_null, unique]
          - name: full_name
            data_tests: [not_null]
          - name: email
            data_tests: [unique]
          - name: registration_date
            data_tests: []
          - name: city
            data_tests: []
          - name: state
            data_tests: []
      - name: products
        identifier: raw_products
        description: >-
          Product catalog records with one row per product, including product name,
          category, unit price, and active status, before staging transformations.
        columns:
          - name: product_id
            data_tests: [not_null, unique]
          - name: product_name
            data_tests: [not_null, unique]
          - name: category
            data_tests: []
          - name: product_id
            data_tests: []
          - name: is_active
            data_tests: []
      - name: orders
        identifier: raw_orders
        description: >-
          Order records with one row per order, including the customer identifier,
          order date, order status, and payment method, before staging transformations.
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: customer_id
            data_tests: [not_null]
          - name: order_date
            data_tests: []
          - name: status
            data_tests: []
          - name: payment_method
            data_tests: []
      - name: order_items
        identifier: raw_order_items
        description: >-
          Order line item records with one row per order item, linking orders to
          products and recording quantity, unit price, and discount before staging
          transformations.
        columns:
          - name: order_item_id
            data_tests: [not_null, unique]
          - name: order_id
            data_tests: [not_null]
          - name: product_id
            data_tests: [not_null]
          - name: quantity
            data_tests: []
          - name: unit_price
            data_tests: []
          - name: discount
            data_tests: []
