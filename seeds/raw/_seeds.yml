version: 2

seeds:
  - name: raw_customers
    description: Fictional raw customer fixtures, loaded before testing the ecom sources.
    config:
      column_types:
        customer_id: integer
        full_name: text
        email: text
        registration_date: text
        city: text
        state: text
  - name: raw_products
    description: Fictional raw catalog fixtures; invalid prices are preserved for staging.
    config:
      column_types:
        product_id: integer
        product_name: text
        category: text
        unit_price: text
        is_active: text
  - name: raw_orders
    description: Fictional raw order fixtures, including intentional duplicates and invalid dates.
    config:
      column_types:
        order_id: integer
        customer_id: integer
        order_date: text
        status: text
        payment_method: text
  - name: raw_order_items
    description: Fictional raw line fixtures, including invalid amounts and unmatched references.
    config:
      column_types:
        order_item_id: integer
        order_id: integer
        product_id: integer
        quantity: integer
        unit_price: text
        discount: text
